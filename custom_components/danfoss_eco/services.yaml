sync_time:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: danfoss_eco

set_vacation:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: danfoss_eco
    temperature:
      required: false
      selector:
        number:
          min: 6
          max: 28
          step: 0.5
          unit_of_measurement: "°C"
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:

set_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: danfoss_eco
    home_temperature:
      required: false
      selector:
        number:
          min: 4
          max: 28
          step: 0.5
          unit_of_measurement: "°C"
    away_temperature:
      required: false
      selector:
        number:
          min: 4
          max: 28
          step: 0.5
          unit_of_measurement: "°C"
    days:
      required: false
      example: "[['07:00','22:00'], ['07:00','22:00'], [], [], [], ['08:00','23:00'], ['08:00','23:00']]"
      selector:
        object:

reset_proxy_stats:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: danfoss_eco

start_placement_test:
  fields:
    name:
      required: true
      example: "bt-proxy-2 on the wall"
      selector:
        text:
    note:
      required: false
      selector:
        text:
          multiline: true
    minutes:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 2880
          unit_of_measurement: min
    reset_proxy_stats:
      required: false
      default: false
      selector:
        boolean:

stop_placement_test:

delete_placement_test:
  fields:
    test_id:
      required: true
      selector:
        text:

edit_placement_test:
  fields:
    test_id:
      required: true
      selector:
        text:
    name:
      required: false
      selector:
        text:
    note:
      required: false
      selector:
        text:
          multiline: true
